<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25a9eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="가투놀이">
  <title>가투놀이 | 시조로 즐기는 실시간 카드 대결</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; height:100dvh; overflow:hidden; background:#25a9eb; }
    #game {
      display:block; position:fixed; inset:0; width:100vw; height:100vh; height:100dvh;
      border:0; background:#25a9eb;
    }
    #loading {
      position:fixed; inset:0; z-index:2; display:grid; place-items:center;
      background:linear-gradient(180deg,#25a9eb,#c7efff 60%,#c58a4d);
      font-family:"Noto Sans KR","Malgun Gothic",sans-serif; color:#164b7a;
      transition:opacity .25s ease;
    }
    #loading.hide { opacity:0; pointer-events:none; }
    #loading img { width:112px; height:112px; border-radius:24px; display:block; margin:0 auto 12px; }
    #loading b { display:block; text-align:center; font-size:29px; color:#125394; }
    #loading span { display:block; text-align:center; font-weight:700; margin-top:6px; }
  </style>
</head>
<body>
  <div id="loading">
    <div>
      <img src="./icons/icon-192.png" alt="가투놀이 아이콘">
      <b>가투놀이</b>
      <span>게임 화면을 불러오는 중입니다.</span>
    </div>
  </div>
  <iframe id="game"
    src="https://script.google.com/macros/s/AKfycby3hymSyJb5pypUnrTuXp7Y7odsbRRuuVsvvb8vz88tqEw5RQuw3RTI_IVj3ZtTa18b/exec"
    title="가투놀이 게임"
    allow="fullscreen; autoplay; screen-wake-lock"
    allowfullscreen></iframe>
  <script>
    const loading = document.getElementById('loading');
    document.getElementById('game').addEventListener('load', () => loading.classList.add('hide'));
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
